name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#e8231d&color_dots=#ebedf0,#ffc9c6,#ff8a84,#e8231d,#9c0d0a
            dist/snake-dark.svg?palette=github-dark&color_snake=#e8231d&color_dots=#161b22,#5a0d0b,#9c0d0a,#e8231d,#ff8a84

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
